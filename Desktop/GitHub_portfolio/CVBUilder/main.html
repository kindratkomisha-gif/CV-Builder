<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CV Builder</title>
</head>
<body>
    <div class="main-area">
        <div class="left-area" id="left-area">
            <input type="text" placeholder="Your name" required id="name">
            <input type="date" required id="dateOfBirthday">
            <input type="text" placeholder="Your phone number" required id="phoneNumber">
            <input type="email" placeholder="Your Email" required id="email">
            <button id="add-kontakt">
                <p>Another kontakt</p>
            </button>
            <textarea type="text" placeholder="Profile" required id="profile"></textarea>
            <textarea type="text"  placeholder="Work Experience" required id="workExperience"></textarea>
            <textarea type="text" placeholder="Education" required id="education"></textarea>  
            <textarea type="text" placeholder="Skills" id="skills"></textarea>
            <textarea type="text" placeholder="Projects" id="projects"></textarea> 
            <button id="download-pdf">Download PDF</button>
        </div>
        <div class="right-area" id="right-area">

        </div>
    </div>
    <script src="skript.js" defer></script>
</body>
</html>
